feature_window:
  start_year: 2015
  end_year: 2019
  min_years_for_mean: 3
  min_country_coverage_rate: 0.45

baseline_blocks:
  # The baseline scoring frame uses World Bank preparedness proxies only (26 indicators, 6/7/4/9).
  # GHS 2019 is integrated by the Stage 4 GHS-enhanced variant, not merged into the baseline blocks.
  include_ghs_2019: false

blocks:
  capacity:
    label: Capacity
    score_label: capacity_score
  preparedness:
    label: Preparedness proxies
    score_label: preparedness_score
    note: GHS 2019 is preferred when a legitimate local file is available; World Bank immunization and infectious-disease-control proxies are used otherwise.
  vulnerability:
    label: Vulnerability protection
    score_label: vulnerability_score
    note: Indicators are oriented so higher score means lower vulnerability burden.
  equity_access:
    label: Equity, access, and financial protection
    score_label: equity_access_score
  context_control:
    label: Context controls
    score_label: context_control

indicators:
  - variable: physicians_per_1000
    label: Physicians per 1,000 people
    source: World Bank
    source_code: SH.MED.PHYS.ZS
    block: capacity
    conceptual_dimension: service_capacity
    direction: beneficial
    years_used: [2015, 2016, 2017, 2018, 2019]
    actionable: true
    counterfactual_allowed: true
    use_as_feature: true

  - variable: nurses_midwives_per_1000
    label: Nurses and midwives per 1,000 people
    source: World Bank
    source_code: SH.MED.NUMW.P3
    block: capacity
    conceptual_dimension: service_capacity
    direction: beneficial
    years_used: [2015, 2016, 2017, 2018, 2019]
    actionable: true
    counterfactual_allowed: true
    use_as_feature: true

  - variable: hospital_beds_per_1000
    label: Hospital beds per 1,000 people
    source: World Bank
    source_code: SH.MED.BEDS.ZS
    block: capacity
    conceptual_dimension: service_capacity
    direction: beneficial
    years_used: [2015, 2016, 2017, 2018, 2019]
    actionable: true
    counterfactual_allowed: true
    use_as_feature: true

  - variable: current_health_expenditure_per_capita_ppp
    label: Current health expenditure per capita, PPP
    source: World Bank
    source_code: SH.XPD.CHEX.PP.CD
    block: capacity
    conceptual_dimension: health_financing
    direction: beneficial
    years_used: [2015, 2016, 2017, 2018, 2019]
    actionable: true
    counterfactual_allowed: true
    use_as_feature: true

  - variable: current_health_expenditure_gdp
